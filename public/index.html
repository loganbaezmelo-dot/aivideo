<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flipbook AI Video</title>
  <style>
    body {
      font-family: sans-serif;
      background: #0b0f19;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      margin: 0;
    }
    .card {
      width: 100%;
      max-width: 500px;
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0 16px 0;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      background: #2563eb;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }
    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    .box {
      padding: 12px;
      border-radius: 6px;
      display: none;
      margin-top: 12px;
      font-size: 14px;
      word-break: break-all;
    }
    .error {
      background: #450a0a;
      color: #f87171;
      border: 1px solid #991b1b;
    }
    .status {
      background: #172554;
      color: #93c5fd;
      border: 1px solid #1e40af;
    }
    canvas {
      width: 100%;
      margin-top: 16px;
      border-radius: 6px;
      background: #000;
      display: none;
    }
    .controls {
      display: none;
      margin-top: 10px;
      align-items: center;
      gap: 10px;
    }
    .controls label { font-size: 12px; color: #94a3b8; }
    .controls input[type="range"] { margin: 0; flex: 1; }
  </style>
</head>
<body>

<div class="card">
  <h2>Smooth AI Flipbook 🎬</h2>
  <label for="prompt">Prompt:</label>
  <input type="text" id="prompt" placeholder="A burning meteor crashing into the sea..." />

  <button id="genBtn" onclick="generateSmartPipeline()">Generate Video</button>

  <div id="statusBox" class="box status"></div>
  <div id="errorBox" class="box error"></div>

  <canvas id="stageCanvas" width="512" height="512"></canvas>

  <div id="controlsBox" class="controls">
    <label for="fpsSlider">Speed:</label>
    <input type="range" id="fpsSlider" min="1" max="8" value="3" oninput="updateSpeed(this.value)" />
    <span id="fpsVal">3 FPS</span>
  </div>
</div>

<script>
let frames = [];
let animInterval = null;
let currentFrameIndex = 0;
let fps = 3;

function updateSpeed(val) {
  fps = parseInt(val);
  document.getElementById("fpsVal").innerText = `${fps} FPS`;
  if (frames.length > 0) startPlayback();
}

function startPlayback() {
  if (animInterval) clearInterval(animInterval);
  const canvas = document.getElementById("stageCanvas");
  const ctx = canvas.getContext("2d");

  animInterval = setInterval(() => {
    const readyFrames = frames.filter(f => f !== null);
    if (readyFrames.length === 0) return;

    currentFrameIndex = currentFrameIndex % readyFrames.length;
    const img = readyFrames[currentFrameIndex];
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    currentFrameIndex = (currentFrameIndex + 1) % readyFrames.length;
  }, 1000 / fps);
}

// Helper to pause execution
const wait = (ms) => new Promise(res => setTimeout(res, ms));

async function fetchFrameWithBackoff(prompt, seed, frameIndex, retries = 2) {
  const encodedPrompt = encodeURIComponent(`${prompt}, frame ${frameIndex + 1}`);
  const frameUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?seed=${seed}&width=512&height=512&nologo=true`;

  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      const res = await fetch(frameUrl);

      if (res.status === 429) {
        if (attempt < retries) {
          // Back off for 2.5 seconds and try again
          await wait(2500);
          continue;
        }
        throw new Error("Rate limit hit on Pollinations! Free server queue is full right now 😭💀");
      }

      if (!res.ok) {
        throw new Error(`API failed with status ${res.status}`);
      }

      const blob = await res.blob();
      const img = new Image();
      const objectUrl = URL.createObjectURL(blob);

      await new Promise((resolve, reject) => {
        img.onload = () => resolve();
        img.onerror = () => reject(new Error("Image decode failed"));
        img.src = objectUrl;
      });

      return img;
    } catch (err) {
      if (attempt === retries) throw err;
      await wait(2000);
    }
  }
}

async function generateSmartPipeline() {
  const prompt = document.getElementById("prompt").value.trim();
  const btn = document.getElementById("genBtn");
  const statusBox = document.getElementById("statusBox");
  const errorBox = document.getElementById("errorBox");
  const canvas = document.getElementById("stageCanvas");
  const controlsBox = document.getElementById("controlsBox");

  errorBox.style.display = "none";
  canvas.style.display = "none";
  controlsBox.style.display = "none";
  if (animInterval) clearInterval(animInterval);

  if (!prompt) {
    errorBox.innerText = "Type a prompt first! 😭";
    errorBox.style.display = "block";
    return;
  }

  // 4 frames avoids triggering the spam filter while keeping a smooth loop
  const totalFrames = 4;
  frames = [];
  btn.disabled = true;
  statusBox.style.display = "block";

  const baseSeed = Math.floor(Math.random() * 10000);

  try {
    for (let i = 0; i < totalFrames; i++) {
      statusBox.innerText = `Fetching frame ${i + 1} of ${totalFrames}... ⏳`;
      
      const frameSeed = baseSeed + (i * 3);
      const img = await fetchFrameWithBackoff(prompt, frameSeed, i);
      frames.push(img);

      // Start playback as soon as 2 frames arrive so there's zero dead waiting time
      if (frames.length === 2) {
        canvas.style.display = "block";
        controlsBox.style.display = "flex";
        startPlayback();
      }

      // Small 400ms breather between calls so their server doesn't think it's a bot attack
      if (i < totalFrames - 1) {
        await wait(400);
      }
    }

    statusBox.innerText = "All frames loaded!";
    setTimeout(() => { statusBox.style.display = "none"; }, 1500);

  } catch (err) {
    statusBox.style.display = "none";
    errorBox.innerText = err.message;
    errorBox.style.display = "block";
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
