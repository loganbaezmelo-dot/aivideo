<script>
async function generateVideo() {
  const prompt = document.getElementById("prompt").value.trim();
  const btn = document.getElementById("genBtn");
  const statusBox = document.getElementById("statusBox");
  const errorBox = document.getElementById("errorBox");
  const video = document.getElementById("outputVideo");

  errorBox.style.display = "none";
  video.style.display = "none";

  if (!prompt) {
    errorBox.innerText = "Please type a prompt first! 😭";
    errorBox.style.display = "block";
    return;
  }

  btn.disabled = true;
  statusBox.innerText = "Queued on GPU... real video diffusion takes 45-90 seconds ⏳";
  statusBox.style.display = "block";

  try {
    const seed = Math.floor(Math.random() * 1000000);
    const encodedPrompt = encodeURIComponent(prompt);
    
    // Explicitly target video diffusion model
    const videoEndpoint = `https://image.pollinations.ai/prompt/${encodedPrompt}?model=cogvideox&seed=${seed}`;

    const res = await fetch(videoEndpoint);

    if (res.status === 429) {
      throw new Error("Rate limit hit! Pollinations free GPU queue is full right now 😭💀");
    }

    if (!res.ok) {
      throw new Error(`Server returned error code: ${res.status}`);
    }

    const contentType = res.headers.get("content-type") || "";

    // If it sent back an image or json error instead of video
    if (!contentType.includes("video") && !contentType.includes("octet-stream")) {
      const text = await res.text();
      if (text.startsWith("{") || text.includes("<html")) {
        throw new Error("API returned an error instead of video data 💀: " + text.slice(0, 100));
      }
      throw new Error(`Received '${contentType}' instead of an MP4 video file! 😭`);
    }

    const blob = await res.blob();
    const videoBlob = new Blob([blob], { type: "video/mp4" });
    const videoUrl = URL.createObjectURL(videoBlob);

    statusBox.style.display = "none";
    video.src = videoUrl;
    video.style.display = "block";
    video.load();
    video.play().catch(() => {});

  } catch (err) {
    statusBox.style.display = "none";
    errorBox.innerText = err.message;
    errorBox.style.display = "block";
  } finally {
    btn.disabled = false;
  }
}
</script>
