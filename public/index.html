<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flipbook AI Video Generator</title>
  <style>
    body {
      font-family: sans-serif;
      background: #0b0f19;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      margin: 0;
    }
    .card {
      width: 100%;
      max-width: 500px;
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0 16px 0;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      background: #2563eb;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }
    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    .box {
      padding: 12px;
      border-radius: 6px;
      display: none;
      margin-top: 12px;
      font-size: 14px;
      word-break: break-all;
    }
    .error {
      background: #450a0a;
      color: #f87171;
      border: 1px solid #991b1b;
    }
    .status {
      background: #172554;
      color: #93c5fd;
      border: 1px solid #1e40af;
    }
    canvas {
      width: 100%;
      margin-top: 16px;
      border-radius: 6px;
      background: #000;
      display: none;
    }
    .controls {
      display: none;
      margin-top: 10px;
      align-items: center;
      gap: 10px;
    }
    .controls label { font-size: 12px; color: #94a3b8; }
    .controls input[type="range"] { margin: 0; flex: 1; }
  </style>
</head>
<body>

<div class="card">
  <h2>AI Video via Frame Flipbook 🎬</h2>
  <label for="prompt">Prompt:</label>
  <input type="text" id="prompt" placeholder="A flaming meteor falling towards an ocean..." />

  <button id="genBtn" onclick="generateFrameVideo()">Generate Video (6 Frames)</button>

  <div id="statusBox" class="box status"></div>
  <div id="errorBox" class="box error"></div>

  <canvas id="stageCanvas" width="512" height="512"></canvas>

  <div id="controlsBox" class="controls">
    <label for="fpsSlider">Speed:</label>
    <input type="range" id="fpsSlider" min="2" max="15" value="6" oninput="updateSpeed(this.value)" />
    <span id="fpsVal">6 FPS</span>
  </div>
</div>

<script>
let frames = [];
let animInterval = null;
let currentFrameIndex = 0;
let fps = 6;

function updateSpeed(val) {
  fps = parseInt(val);
  document.getElementById("fpsVal").innerText = `${fps} FPS`;
  if (frames.length > 0) {
    startPlayback();
  }
}

function startPlayback() {
  if (animInterval) clearInterval(animInterval);
  const canvas = document.getElementById("stageCanvas");
  const ctx = canvas.getContext("2d");

  animInterval = setInterval(() => {
    if (frames.length === 0) return;
    const img = frames[currentFrameIndex];
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    currentFrameIndex = (currentFrameIndex + 1) % frames.length;
  }, 1000 / fps);
}

async function generateFrameVideo() {
  const prompt = document.getElementById("prompt").value.trim();
  const btn = document.getElementById("genBtn");
  const statusBox = document.getElementById("statusBox");
  const errorBox = document.getElementById("errorBox");
  const canvas = document.getElementById("stageCanvas");
  const controlsBox = document.getElementById("controlsBox");

  errorBox.style.display = "none";
  canvas.style.display = "none";
  controlsBox.style.display = "none";
  if (animInterval) clearInterval(animInterval);
  frames = [];

  if (!prompt) {
    errorBox.innerText = "Type a prompt first! 😭";
    errorBox.style.display = "block";
    return;
  }

  btn.disabled = true;
  statusBox.style.display = "block";

  const totalFrames = 6;
  const baseSeed = Math.floor(Math.random() * 10000);

  try {
    for (let i = 0; i < totalFrames; i++) {
      statusBox.innerText = `Fetching frame ${i + 1} of ${totalFrames}... ⏳`;
      
      // Incremental seed so each frame shows a slight progression
      const frameSeed = baseSeed + (i * 2);
      const encodedPrompt = encodeURIComponent(`${prompt}, sequential frame ${i + 1}`);
      const frameUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?seed=${frameSeed}&width=512&height=512&nologo=true`;

      const res = await fetch(frameUrl);

      if (res.status === 429) {
        throw new Error("Rate limit hit on Pollinations! 😭💀");
      }

      if (!res.ok) {
        throw new Error(`API failed on frame ${i + 1} with status ${res.status}`);
      }

      const blob = await res.blob();
      const img = new Image();
      const objectUrl = URL.createObjectURL(blob);

      await new Promise((resolve, reject) => {
        img.onload = () => resolve();
        img.onerror = () => reject(new Error(`Failed to load frame ${i + 1} image data`));
        img.src = objectUrl;
      });

      frames.push(img);
    }

    statusBox.style.display = "none";
    canvas.style.display = "block";
    controlsBox.style.display = "flex";

    currentFrameIndex = 0;
    startPlayback();

  } catch (err) {
    statusBox.style.display = "none";
    errorBox.innerText = err.message;
    errorBox.style.display = "block";
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
