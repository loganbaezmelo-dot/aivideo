<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fast Flipbook Video</title>
  <style>
    body {
      font-family: sans-serif;
      background: #0b0f19;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      margin: 0;
    }
    .card {
      width: 100%;
      max-width: 500px;
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0 16px 0;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      background: #2563eb;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }
    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    .box {
      padding: 12px;
      border-radius: 6px;
      display: none;
      margin-top: 12px;
      font-size: 14px;
      word-break: break-all;
    }
    .error {
      background: #450a0a;
      color: #f87171;
      border: 1px solid #991b1b;
    }
    .status {
      background: #172554;
      color: #93c5fd;
      border: 1px solid #1e40af;
    }
    canvas {
      width: 100%;
      margin-top: 16px;
      border-radius: 6px;
      background: #000;
      display: none;
    }
    .controls {
      display: none;
      margin-top: 10px;
      align-items: center;
      gap: 10px;
    }
    .controls label { font-size: 12px; color: #94a3b8; }
    .controls input[type="range"] { margin: 0; flex: 1; }
  </style>
</head>
<body>

<div class="card">
  <h2>Fast Parallel Flipbook ⚡</h2>
  <label for="prompt">Prompt:</label>
  <input type="text" id="prompt" placeholder="A flaming meteor falling towards an ocean..." />

  <button id="genBtn" onclick="generateParallel()">Generate Turbo (Parallel)</button>

  <div id="statusBox" class="box status"></div>
  <div id="errorBox" class="box error"></div>

  <canvas id="stageCanvas" width="512" height="512"></canvas>

  <div id="controlsBox" class="controls">
    <label for="fpsSlider">Speed:</label>
    <input type="range" id="fpsSlider" min="1" max="10" value="3" oninput="updateSpeed(this.value)" />
    <span id="fpsVal">3 FPS</span>
  </div>
</div>

<script>
let frames = [];
let animInterval = null;
let currentFrameIndex = 0;
let fps = 3; // Defaulting to 3 FPS so it doesn't give you whiplash 😭

function updateSpeed(val) {
  fps = parseInt(val);
  document.getElementById("fpsVal").innerText = `${fps} FPS`;
  if (frames.length > 0) startPlayback();
}

function startPlayback() {
  if (animInterval) clearInterval(animInterval);
  const canvas = document.getElementById("stageCanvas");
  const ctx = canvas.getContext("2d");

  animInterval = setInterval(() => {
    // Only play frames that have actually loaded
    const readyFrames = frames.filter(f => f !== null);
    if (readyFrames.length === 0) return;

    currentFrameIndex = currentFrameIndex % readyFrames.length;
    const img = readyFrames[currentFrameIndex];
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    currentFrameIndex = (currentFrameIndex + 1) % readyFrames.length;
  }, 1000 / fps);
}

async function fetchSingleFrame(prompt, seed, frameIndex, totalFrames) {
  const encodedPrompt = encodeURIComponent(`${prompt}, sequential motion frame ${frameIndex + 1}`);
  const frameUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?seed=${seed}&width=512&height=512&nologo=true`;

  const res = await fetch(frameUrl);
  if (res.status === 429) {
    throw new Error("Rate limit hit on Pollinations! 😭💀");
  }
  if (!res.ok) {
    throw new Error(`Frame ${frameIndex + 1} failed (Status: ${res.status})`);
  }

  const blob = await res.blob();
  const img = new Image();
  const objectUrl = URL.createObjectURL(blob);

  await new Promise((resolve, reject) => {
    img.onload = () => resolve();
    img.onerror = () => reject(new Error(`Failed to decode frame ${frameIndex + 1}`));
    img.src = objectUrl;
  });

  return img;
}

async function generateParallel() {
  const prompt = document.getElementById("prompt").value.trim();
  const btn = document.getElementById("genBtn");
  const statusBox = document.getElementById("statusBox");
  const errorBox = document.getElementById("errorBox");
  const canvas = document.getElementById("stageCanvas");
  const controlsBox = document.getElementById("controlsBox");

  errorBox.style.display = "none";
  canvas.style.display = "none";
  controlsBox.style.display = "none";
  if (animInterval) clearInterval(animInterval);

  if (!prompt) {
    errorBox.innerText = "Type a prompt first! 😭";
    errorBox.style.display = "block";
    return;
  }

  const totalFrames = 6;
  frames = new Array(totalFrames).fill(null);
  btn.disabled = true;
  statusBox.innerText = `Firing 6 parallel requests to GPU... 🚀`;
  statusBox.style.display = "block";

  const baseSeed = Math.floor(Math.random() * 10000);
  let completedCount = 0;

  try {
    // Launch all 6 network requests simultaneously
    const framePromises = Array.from({ length: totalFrames }, (_, i) => {
      const frameSeed = baseSeed + (i * 2);
      return fetchSingleFrame(prompt, frameSeed, i, totalFrames)
        .then((img) => {
          frames[i] = img;
          completedCount++;
          statusBox.innerText = `Downloaded ${completedCount}/${totalFrames} frames simultaneously... ⚡`;
          
          // Show canvas immediately as soon as the first frame lands
          if (completedCount === 1) {
            canvas.style.display = "block";
            controlsBox.style.display = "flex";
            startPlayback();
          }
        });
    });

    await Promise.all(framePromises);

    statusBox.innerText = "All frames loaded!";
    setTimeout(() => { statusBox.style.display = "none"; }, 1500);

  } catch (err) {
    statusBox.style.display = "none";
    errorBox.innerText = err.message;
    errorBox.style.display = "block";
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
